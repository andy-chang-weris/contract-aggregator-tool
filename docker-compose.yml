services:
  app:
    image: ${APP_IMAGE_NAME:-ai-agent-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "5000:5000"
      - "5055:5055" 
    env_file:
      - ./agent/.env
    environment:
      FRONTEND_PORT: "8000"
      PROXY_PORT: "5000"
      CHAT_SERVER_HOST: "0.0.0.0"
      CHAT_SERVER_PORT: "5055"
      # DB_SECRET_NAME: "contract-aggregator/dev/database"
      AWS_DEFAULT_REGION: "us-east-1"
      RAG_LLM_PROVIDER: "bedrock"
      RAG_LLM_MODEL: "deepseek.v3.2"

      RAG_EMBEDDING_PROVIDER: "bedrock"
      RAG_EMBEDDING_MODEL: "cohere.embed-english-v3"

      RAG_MAX_TOKENS: "1200"
      DEV_RELOAD: "1"
    volumes:
      - .:/app
      - ${USERPROFILE}/.aws:/root/.aws:ro
  mcp:
    build: ./contract-mcp-server
    ports: 
      - "3000:3000"
    environment:
      BACKEND_URL: http://app:8000
      PORT: "3000"
    depends_on:
      - app

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

# The Docker Compose Cron Sidecar
  cron-scheduler:
    image: docker:cli  # Use the official lightweight Docker CLI image instead of plain alpine
    container_name: cron-scheduler
    command: crond -f -l 2 -L /dev/stdout
    environment:
      - TZ=America/New_York
    volumes:
      - ./crontab:/etc/crontabs/root
      - /var/run/docker.sock:/var/run/docker.sock  # Allows container to talk to host Docker
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
