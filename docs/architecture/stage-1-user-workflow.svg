<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .note { font: 14px Arial, sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 14; }
      .side { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 14; }
      .aws { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 14; }
      .data { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 14; }
      .good { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 14; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #6b7280; }
      .num { font: 700 13px Arial, sans-serif; fill: #ffffff; }
      .bubble { fill: #111827; }
      .arrow { stroke: #111827; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#111827" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#6b7280" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760" />
  <text class="title" x="56" y="60">Stage 1 User Workflow Through Architecture</text>
  <text class="note" x="56" y="86">Left to right: what happens when a user enters the app, plus the startup dependencies ECS needs before serving traffic.</text>

  <rect class="side" x="70" y="155" width="1140" height="240" />
  <text class="label" x="95" y="188">Runtime request path</text>

  <g transform="translate(110,245)">
    <rect class="box" x="0" y="0" width="140" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">1</text>
    <text class="label" x="48" y="32">User</text>
    <text class="small" x="48" y="55">opens app</text>
  </g>

  <g transform="translate(330,245)">
    <rect class="box" x="0" y="0" width="150" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">2</text>
    <text class="label" x="48" y="32">ALB</text>
    <text class="small" x="48" y="55">receives HTTP</text>
  </g>

  <g transform="translate(570,245)">
    <rect class="good" x="0" y="0" width="170" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">3</text>
    <text class="label" x="48" y="32">ECS App</text>
    <text class="small" x="48" y="55">handles request</text>
  </g>

  <g transform="translate(835,245)">
    <rect class="data" x="0" y="0" width="155" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">4</text>
    <text class="label" x="48" y="32">RDS</text>
    <text class="small" x="48" y="55">read/write data</text>
  </g>

  <g transform="translate(1060,245)">
    <rect class="box" x="0" y="0" width="120" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">5</text>
    <text class="label" x="48" y="32">User</text>
    <text class="small" x="48" y="55">gets page</text>
  </g>

  <path class="arrow" d="M250 284 L330 284" />
  <path class="arrow" d="M480 284 L570 284" />
  <path class="arrow" d="M740 284 L835 284" />
  <path class="arrow" d="M990 284 L1060 284" />
  <path class="dash" d="M835 325 C760 380, 335 390, 250 325" />
  <text class="tiny" x="498" y="374">response travels back through ECS and ALB</text>

  <rect class="side" x="70" y="455" width="1140" height="180" />
  <text class="label" x="95" y="488">Startup and support path</text>
  <text class="tiny" x="95" y="510">These must work before the user request path can succeed.</text>

  <rect class="aws" x="255" y="540" width="150" height="62" />
  <text class="label" x="303" y="566">ECR</text>
  <text class="small" x="282" y="587">pull image</text>

  <rect class="aws" x="470" y="540" width="155" height="62" />
  <text class="label" x="503" y="566">Secrets</text>
  <text class="small" x="498" y="587">DB config</text>

  <rect class="good" x="690" y="540" width="155" height="62" />
  <text class="label" x="727" y="566">ECS App</text>
  <text class="small" x="725" y="587">starts up</text>

  <rect class="aws" x="910" y="540" width="170" height="62" />
  <text class="label" x="950" y="566">CloudWatch</text>
  <text class="small" x="958" y="587">logs events</text>

  <path class="arrow" d="M405 571 L470 571" />
  <path class="arrow" d="M625 571 L690 571" />
  <path class="dash" d="M845 571 L910 571" />
  <path class="dash" d="M767 540 C760 480, 675 390, 655 323" />

  <text class="tiny" x="70" y="700">If ECR, Secrets, Logs, DNS, or return traffic is blocked by routing/NACL/security groups, the ECS app never becomes healthy.</text>
</svg>
