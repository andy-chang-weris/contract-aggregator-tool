<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .note { font: 14px Arial, sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 14; }
      .side { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 14; }
      .aws { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 14; }
      .data { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 14; }
      .good { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 14; }
      .private { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; rx: 14; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #6b7280; }
      .num { font: 700 13px Arial, sans-serif; fill: #ffffff; }
      .bubble { fill: #111827; }
      .arrow { stroke: #111827; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#111827" /></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7280" /></marker>
  </defs>

  <rect class="bg" width="1280" height="760" />
  <text class="title" x="56" y="60">Stage 4 User Workflow Through Architecture</text>
  <text class="note" x="56" y="86">User path is unchanged from Stage 3; the internal route changes so ECS and RDS are no longer publicly addressable.</text>

  <rect class="side" x="55" y="150" width="1170" height="250" />
  <text class="label" x="82" y="184">Runtime request path</text>

  <g transform="translate(90,245)"><rect class="box" width="105" height="78" /><circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">1</text><text class="label" x="48" y="32">User</text><text class="small" x="48" y="55">URL</text></g>
  <g transform="translate(245,245)"><rect class="aws" width="110" height="78" /><circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">2</text><text class="label" x="48" y="32">DNS</text><text class="small" x="48" y="55">ALB</text></g>
  <g transform="translate(405,245)"><rect class="good" width="145" height="78" /><circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">3</text><text class="label" x="48" y="32">Public ALB</text><text class="small" x="48" y="55">HTTPS</text></g>
  <g transform="translate(615,245)"><rect class="private" width="145" height="78" /><circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">4</text><text class="label" x="48" y="32">Private ECS</text><text class="small" x="48" y="55">no public IP</text></g>
  <g transform="translate(830,245)"><rect class="data" width="140" height="78" /><circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">5</text><text class="label" x="48" y="32">Private RDS</text><text class="small" x="48" y="55">data</text></g>
  <g transform="translate(1040,245)"><rect class="box" width="125" height="78" /><circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">6</text><text class="label" x="48" y="32">User</text><text class="small" x="48" y="55">response</text></g>

  <path class="arrow" d="M195 284 L245 284" />
  <path class="arrow" d="M355 284 L405 284" />
  <path class="arrow" d="M550 284 L615 284" />
  <path class="arrow" d="M760 284 L830 284" />
  <path class="arrow" d="M970 284 L1040 284" />
  <path class="dash" d="M830 323 C700 390, 335 390, 195 323" />
  <text class="tiny" x="435" y="374">only the ALB is public; app and DB stay inside private subnets</text>

  <rect class="side" x="55" y="455" width="1170" height="185" />
  <text class="label" x="82" y="489">Private startup/support path</text>
  <text class="tiny" x="82" y="511">Private ECS still needs AWS APIs to start, fetch configuration, and emit logs.</text>

  <rect class="private" x="145" y="545" width="155" height="62" /><text class="label" x="179" y="571">Private ECS</text><text class="small" x="177" y="592">starts task</text>
  <rect class="aws" x="365" y="545" width="140" height="62" /><text class="label" x="410" y="571">ECR</text><text class="small" x="392" y="592">pull image</text>
  <rect class="aws" x="570" y="545" width="145" height="62" /><text class="label" x="604" y="571">Secrets</text><text class="small" x="590" y="592">read config</text>
  <rect class="aws" x="780" y="545" width="135" height="62" /><text class="label" x="817" y="571">Logs</text><text class="small" x="805" y="592">CloudWatch</text>
  <rect class="aws" x="980" y="545" width="155" height="62" /><text class="label" x="1009" y="571">NAT / VPC</text><text class="small" x="1015" y="592">endpoints</text>

  <path class="dash" d="M300 576 L365 576" />
  <path class="dash" d="M505 576 L570 576" />
  <path class="dash" d="M715 576 L780 576" />
  <path class="dash" d="M915 576 L980 576" />
  <path class="dash" d="M222 545 C300 455, 600 370, 688 323" />

  <text class="tiny" x="55" y="704">Stage 4 is complete when user behavior is unchanged, ECS tasks have no public IPs, and image pulls/secrets/logs work through NAT or VPC endpoints.</text>
</svg>
