<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .note { font: 14px Arial, sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 14; }
      .side { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 14; }
      .aws { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 14; }
      .data { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 14; }
      .good { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 14; }
      .ops { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; rx: 14; }
      .secure { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 14; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #6b7280; }
      .num { font: 700 13px Arial, sans-serif; fill: #ffffff; }
      .bubble { fill: #111827; }
      .arrow { stroke: #111827; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#111827" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#6b7280" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760" />
  <text class="title" x="56" y="60">Stage 3 User Workflow Through Architecture</text>
  <text class="note" x="56" y="86">User flow stays the same as Stage 2; Stage 3 adds health, failover, scaling, and operations around that flow.</text>

  <rect class="side" x="55" y="150" width="1170" height="250" />
  <text class="label" x="82" y="184">Runtime request path</text>

  <g transform="translate(82,245)">
    <rect class="box" x="0" y="0" width="105" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">1</text>
    <text class="label" x="48" y="32">User</text>
    <text class="small" x="48" y="55">URL</text>
  </g>

  <g transform="translate(230,245)">
    <rect class="aws" x="0" y="0" width="110" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">2</text>
    <text class="label" x="48" y="32">DNS</text>
    <text class="small" x="48" y="55">ALB</text>
  </g>

  <g transform="translate(385,245)">
    <rect class="secure" x="0" y="0" width="125" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">3</text>
    <text class="label" x="48" y="32">ALB</text>
    <text class="small" x="48" y="55">HTTPS</text>
  </g>

  <g transform="translate(565,205)">
    <rect class="good" x="0" y="0" width="145" height="72" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">4a</text>
    <text class="label" x="52" y="32">Task A</text>
    <text class="small" x="52" y="54">healthy</text>
  </g>

  <g transform="translate(565,315)">
    <rect class="good" x="0" y="0" width="145" height="72" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">4b</text>
    <text class="label" x="52" y="32">Task B</text>
    <text class="small" x="52" y="54">healthy</text>
  </g>

  <g transform="translate(790,245)">
    <rect class="data" x="0" y="0" width="130" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">5</text>
    <text class="label" x="48" y="32">RDS</text>
    <text class="small" x="48" y="55">data</text>
  </g>

  <g transform="translate(990,245)">
    <rect class="box" x="0" y="0" width="125" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">6</text>
    <text class="label" x="48" y="32">User</text>
    <text class="small" x="48" y="55">response</text>
  </g>

  <path class="arrow" d="M187 284 L230 284" />
  <path class="arrow" d="M340 284 L385 284" />
  <path class="arrow" d="M510 284 L565 241" />
  <path class="arrow" d="M510 284 L565 351" />
  <path class="arrow" d="M710 241 L790 284" />
  <path class="arrow" d="M710 351 L790 284" />
  <path class="arrow" d="M920 284 L990 284" />
  <path class="dash" d="M790 323 C665 388, 320 390, 187 323" />
  <text class="tiny" x="455" y="374">ALB chooses a healthy task; response returns through the same public endpoint</text>

  <rect class="side" x="55" y="455" width="1170" height="185" />
  <text class="label" x="82" y="489">Reliability and operations loop</text>
  <text class="tiny" x="82" y="511">These mechanisms do not change the user path; they keep it healthy.</text>

  <rect class="ops" x="160" y="545" width="165" height="62" />
  <text class="label" x="197" y="571">Health Check</text>
  <text class="small" x="195" y="592">replace bad task</text>

  <rect class="ops" x="385" y="545" width="155" height="62" />
  <text class="label" x="417" y="571">Scaling</text>
  <text class="small" x="414" y="592">add capacity</text>

  <rect class="ops" x="600" y="545" width="155" height="62" />
  <text class="label" x="638" y="571">Alarms</text>
  <text class="small" x="629" y="592">notify failure</text>

  <rect class="ops" x="815" y="545" width="165" height="62" />
  <text class="label" x="852" y="571">Dashboard</text>
  <text class="small" x="848" y="592">observe service</text>

  <rect class="data" x="1040" y="545" width="130" height="62" />
  <text class="label" x="1071" y="571">Backups</text>
  <text class="small" x="1070" y="592">RDS restore</text>

  <path class="dash" d="M242 545 C310 475, 520 375, 602 277" />
  <path class="dash" d="M462 545 C525 470, 575 400, 625 387" />
  <path class="dash" d="M677 545 C710 470, 760 365, 855 323" />
  <path class="dash" d="M897 545 C880 465, 825 380, 855 323" />
  <path class="dash" d="M1105 545 C1050 455, 965 360, 890 323" />

  <text class="tiny" x="55" y="704">Stage 3 is complete when one task can fail without user-visible outage, metrics/alarms show the issue, and RDS has a tested backup posture.</text>
</svg>
