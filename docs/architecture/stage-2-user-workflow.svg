<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .note { font: 14px Arial, sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 14; }
      .side { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 14; }
      .aws { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 14; }
      .data { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 14; }
      .good { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 14; }
      .secure { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 14; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #6b7280; }
      .num { font: 700 13px Arial, sans-serif; fill: #ffffff; }
      .bubble { fill: #111827; }
      .arrow { stroke: #111827; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#111827" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#6b7280" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760" />
  <text class="title" x="56" y="60">Stage 2 User Workflow Through Architecture</text>
  <text class="note" x="56" y="86">Left to right: real user enters through a stable HTTPS domain; ALB gates traffic and forwards only healthy requests to ECS.</text>

  <rect class="side" x="55" y="150" width="1170" height="250" />
  <text class="label" x="82" y="184">Runtime request path</text>

  <g transform="translate(90,245)">
    <rect class="box" x="0" y="0" width="115" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">1</text>
    <text class="label" x="48" y="32">User</text>
    <text class="small" x="48" y="55">opens URL</text>
  </g>

  <g transform="translate(255,245)">
    <rect class="aws" x="0" y="0" width="120" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">2</text>
    <text class="label" x="48" y="32">DNS</text>
    <text class="small" x="48" y="55">domain -> ALB</text>
  </g>

  <g transform="translate(425,245)">
    <rect class="secure" x="0" y="0" width="125" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">3</text>
    <text class="label" x="48" y="32">HTTPS</text>
    <text class="small" x="48" y="55">TLS cert</text>
  </g>

  <g transform="translate(605,245)">
    <rect class="secure" x="0" y="0" width="135" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">4</text>
    <text class="label" x="48" y="32">ALB</text>
    <text class="small" x="48" y="55">healthy target</text>
  </g>

  <g transform="translate(795,245)">
    <rect class="good" x="0" y="0" width="145" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">5</text>
    <text class="label" x="48" y="32">ECS App</text>
    <text class="small" x="48" y="55">serves app</text>
  </g>

  <g transform="translate(995,245)">
    <rect class="data" x="0" y="0" width="135" height="78" />
    <circle class="bubble" cx="22" cy="22" r="14" /><text class="num" x="18" y="27">6</text>
    <text class="label" x="48" y="32">RDS</text>
    <text class="small" x="48" y="55">data</text>
  </g>

  <path class="arrow" d="M205 284 L255 284" />
  <path class="arrow" d="M375 284 L425 284" />
  <path class="arrow" d="M550 284 L605 284" />
  <path class="arrow" d="M740 284 L795 284" />
  <path class="arrow" d="M940 284 L995 284" />
  <path class="dash" d="M995 323 C850 385, 390 390, 205 323" />
  <text class="tiny" x="500" y="374">response returns through ECS -> ALB -> HTTPS -> user</text>

  <rect class="side" x="55" y="455" width="1170" height="185" />
  <text class="label" x="82" y="489">Stage 2 support checks</text>
  <text class="tiny" x="82" y="511">These are not user actions, but they determine whether the user path is safe and reliable.</text>

  <rect class="secure" x="185" y="545" width="165" height="62" />
  <text class="label" x="228" y="571">ALB Health</text>
  <text class="small" x="222" y="592">targets healthy</text>

  <rect class="aws" x="415" y="545" width="150" height="62" />
  <text class="label" x="463" y="571">ECR</text>
  <text class="small" x="443" y="592">image exists</text>

  <rect class="aws" x="630" y="545" width="155" height="62" />
  <text class="label" x="663" y="571">Secrets</text>
  <text class="small" x="654" y="592">DB config read</text>

  <rect class="aws" x="850" y="545" width="160" height="62" />
  <text class="label" x="890" y="571">Logs</text>
  <text class="small" x="878" y="592">requests/errors</text>

  <path class="dash" d="M267 545 C310 475, 640 390, 672 323" />
  <path class="dash" d="M490 545 C545 490, 760 395, 848 323" />
  <path class="dash" d="M708 545 C750 475, 810 390, 855 323" />
  <path class="dash" d="M930 545 C930 470, 890 390, 865 323" />

  <text class="tiny" x="55" y="704">Stage 2 is complete when the public contract is the HTTPS domain, ALB target health is green, ECS is reachable only from ALB, and Stage 1 app/DB/log tests still pass.</text>
</svg>
