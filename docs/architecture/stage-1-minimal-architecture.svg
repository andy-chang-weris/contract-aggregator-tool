<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .note { font: 14px Arial, sans-serif; fill: #6b7280; }
      .group { fill: #f9fafb; stroke: #d1d5db; stroke-width: 2; rx: 18; }
      .subnet { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; rx: 14; }
      .svc { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 12; }
      .aws { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 12; }
      .data { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 12; }
      .net { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 12; }
      .warn { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; rx: 12; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #6b7280; }
      .arrow { stroke: #111827; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#111827" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#6b7280" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760" />
  <text class="title" x="56" y="60">Stage 1 Minimal Architecture</text>
  <text class="note" x="56" y="86">Smallest user-facing AWS shape worth building toward: ALB entry, ECS app, RDS persistence, ECR image, Secrets, Logs.</text>

  <rect class="svc" x="56" y="330" width="130" height="72" />
  <text class="label" x="88" y="360">Users</text>
  <text class="small" x="82" y="384">Browser</text>

  <rect class="group" x="250" y="130" width="780" height="500" />
  <text class="label" x="282" y="164">VPC</text>
  <text class="tiny" x="322" y="164">Stage 1 target network boundary</text>

  <rect class="net" x="300" y="205" width="230" height="70" />
  <text class="label" x="330" y="236">Internet Gateway</text>
  <text class="small" x="330" y="258">public route out</text>

  <rect class="svc" x="595" y="205" width="330" height="70" />
  <text class="label" x="640" y="236">Application Load Balancer</text>
  <text class="small" x="676" y="258">HTTP :80 -> app :8000</text>

  <rect class="subnet" x="300" y="330" width="300" height="210" />
  <text class="label" x="332" y="362">Public Subnet A</text>
  <text class="tiny" x="332" y="384">AZ us-east-1a</text>
  <rect class="svc" x="338" y="425" width="220" height="70" />
  <text class="label" x="376" y="456">ECS Fargate</text>
  <text class="small" x="375" y="478">ai-agent container</text>

  <rect class="subnet" x="670" y="330" width="300" height="210" />
  <text class="label" x="702" y="362">Public Subnet B</text>
  <text class="tiny" x="702" y="384">AZ us-east-1b</text>
  <rect class="svc" x="708" y="425" width="220" height="70" />
  <text class="label" x="746" y="456">ECS Fargate</text>
  <text class="small" x="741" y="478">same ECS service</text>

  <rect class="warn" x="426" y="565" width="415" height="45" />
  <text class="small" x="457" y="593">NACL must allow HTTPS, DNS, app traffic, and return traffic</text>

  <rect class="aws" x="1080" y="160" width="150" height="70" />
  <text class="label" x="1114" y="191">ECR</text>
  <text class="small" x="1103" y="213">app image</text>

  <rect class="aws" x="1080" y="270" width="150" height="70" />
  <text class="label" x="1100" y="301">Secrets</text>
  <text class="small" x="1106" y="323">DB config</text>

  <rect class="aws" x="1080" y="380" width="150" height="70" />
  <text class="label" x="1093" y="411">CloudWatch</text>
  <text class="small" x="1116" y="433">logs</text>

  <rect class="data" x="1080" y="500" width="150" height="85" />
  <text class="label" x="1100" y="532">RDS</text>
  <text class="small" x="1097" y="554">PostgreSQL</text>
  <text class="tiny" x="1096" y="574">private access</text>

  <path class="arrow" d="M186 366 L250 366 L250 240 L595 240" />
  <path class="arrow" d="M760 275 L760 425" />
  <path class="arrow" d="M595 240 L530 240" />
  <path class="dash" d="M928 450 C1000 410, 1010 200, 1080 195" />
  <path class="dash" d="M928 455 C1005 430, 1015 310, 1080 305" />
  <path class="dash" d="M928 462 C1010 462, 1020 420, 1080 415" />
  <path class="arrow" d="M928 480 C1010 500, 1020 535, 1080 542" />

  <text class="tiny" x="56" y="695">Stable Stage 1 contract: app image in ECR, ECS task definition, DB secret, RDS database, logs, and a single user endpoint.</text>
</svg>
