<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .note { font: 14px Arial, sans-serif; fill: #6b7280; }
      .group { fill: #f9fafb; stroke: #d1d5db; stroke-width: 2; rx: 18; }
      .subnet { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; rx: 14; }
      .svc { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 12; }
      .aws { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 12; }
      .data { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 12; }
      .net { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 12; }
      .secure { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 12; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #6b7280; }
      .arrow { stroke: #111827; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#111827" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#6b7280" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760" />
  <text class="title" x="56" y="60">Stage 2 Minimal Architecture</text>
  <text class="note" x="56" y="86">Production ingress layer on top of Stage 1: stable domain, HTTPS, ALB health checks, and tighter service boundaries.</text>

  <rect class="svc" x="50" y="330" width="125" height="72" />
  <text class="label" x="82" y="360">Users</text>
  <text class="small" x="76" y="384">Browser</text>

  <rect class="aws" x="205" y="330" width="135" height="72" />
  <text class="label" x="246" y="360">DNS</text>
  <text class="small" x="232" y="384">Route 53</text>

  <rect class="secure" x="370" y="330" width="145" height="72" />
  <text class="label" x="418" y="360">TLS</text>
  <text class="small" x="402" y="384">ACM cert</text>

  <rect class="group" x="555" y="130" width="515" height="500" />
  <text class="label" x="585" y="164">VPC</text>
  <text class="tiny" x="625" y="164">ALB is the public boundary; app and DB accept private trusted traffic only.</text>

  <rect class="net" x="595" y="205" width="185" height="70" />
  <text class="label" x="624" y="236">Internet GW</text>
  <text class="small" x="625" y="258">public ALB route</text>

  <rect class="secure" x="820" y="205" width="210" height="70" />
  <text class="label" x="865" y="236">ALB HTTPS</text>
  <text class="small" x="852" y="258">443 -> target group</text>

  <rect class="subnet" x="595" y="330" width="200" height="210" />
  <text class="label" x="622" y="362">Subnet A</text>
  <text class="tiny" x="622" y="384">AZ us-east-1a</text>
  <rect class="svc" x="620" y="425" width="150" height="70" />
  <text class="label" x="646" y="456">ECS App</text>
  <text class="small" x="646" y="478">target :8000</text>

  <rect class="subnet" x="835" y="330" width="200" height="210" />
  <text class="label" x="862" y="362">Subnet B</text>
  <text class="tiny" x="862" y="384">AZ us-east-1b</text>
  <rect class="svc" x="860" y="425" width="150" height="70" />
  <text class="label" x="886" y="456">ECS App</text>
  <text class="small" x="884" y="478">same service</text>

  <rect class="data" x="1120" y="420" width="125" height="85" />
  <text class="label" x="1154" y="452">RDS</text>
  <text class="small" x="1129" y="474">PostgreSQL</text>
  <text class="tiny" x="1134" y="494">ECS SG only</text>

  <rect class="aws" x="1120" y="160" width="125" height="62" />
  <text class="label" x="1151" y="187">ECR</text>
  <text class="tiny" x="1142" y="207">image pull</text>

  <rect class="aws" x="1120" y="255" width="125" height="62" />
  <text class="label" x="1133" y="282">Secrets</text>
  <text class="tiny" x="1134" y="302">DB config</text>

  <rect class="aws" x="1120" y="540" width="125" height="62" />
  <text class="label" x="1132" y="567">Logs</text>
  <text class="tiny" x="1139" y="587">CloudWatch</text>

  <path class="arrow" d="M175 366 L205 366" />
  <path class="arrow" d="M340 366 L370 366" />
  <path class="arrow" d="M515 366 C620 366, 720 245, 820 240" />
  <path class="arrow" d="M925 275 L925 425" />
  <path class="arrow" d="M1010 460 L1120 462" />
  <path class="dash" d="M1010 435 C1065 390, 1070 195, 1120 190" />
  <path class="dash" d="M1010 445 C1065 420, 1070 288, 1120 286" />
  <path class="dash" d="M1010 485 C1070 520, 1080 570, 1120 571" />

  <text class="tiny" x="56" y="694">Stage 2 changes the public contract from raw infrastructure access to a stable HTTPS endpoint. ECS should accept inbound app traffic only from the ALB.</text>
</svg>
