<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .note { font: 14px Arial, sans-serif; fill: #6b7280; }
      .group { fill: #f9fafb; stroke: #d1d5db; stroke-width: 2; rx: 18; }
      .subnet { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; rx: 14; }
      .svc { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 12; }
      .aws { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 12; }
      .data { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 12; }
      .net { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 12; }
      .private { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; rx: 12; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #6b7280; }
      .arrow { stroke: #111827; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#111827" /></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7280" /></marker>
  </defs>

  <rect class="bg" width="1280" height="760" />
  <text class="title" x="56" y="60">Stage 4 Minimal Architecture</text>
  <text class="note" x="56" y="86">Private networking: ALB remains public; ECS and RDS move behind private subnet boundaries with controlled outbound AWS access.</text>

  <rect class="svc" x="45" y="330" width="115" height="72" />
  <text class="label" x="74" y="360">Users</text>
  <text class="small" x="69" y="384">Browser</text>

  <rect class="aws" x="190" y="330" width="115" height="72" />
  <text class="label" x="223" y="360">DNS</text>
  <text class="small" x="209" y="384">Route 53</text>

  <rect class="group" x="345" y="115" width="760" height="540" />
  <text class="label" x="375" y="150">Purpose-built VPC</text>
  <text class="tiny" x="505" y="150">public ALB subnets, private app subnets, private DB subnets</text>

  <rect class="subnet" x="385" y="200" width="180" height="145" />
  <text class="label" x="415" y="230">Public A</text>
  <rect class="net" x="410" y="265" width="130" height="54" />
  <text class="small" x="445" y="287">ALB</text>
  <text class="tiny" x="430" y="307">HTTPS :443</text>

  <rect class="subnet" x="605" y="200" width="180" height="145" />
  <text class="label" x="635" y="230">Public B</text>
  <rect class="net" x="630" y="265" width="130" height="54" />
  <text class="small" x="665" y="287">ALB</text>
  <text class="tiny" x="650" y="307">HTTPS :443</text>

  <rect class="subnet" x="385" y="395" width="180" height="145" />
  <text class="label" x="413" y="425">Private App A</text>
  <rect class="private" x="410" y="460" width="130" height="54" />
  <text class="small" x="444" y="482">ECS</text>
  <text class="tiny" x="426" y="502">no public IP</text>

  <rect class="subnet" x="605" y="395" width="180" height="145" />
  <text class="label" x="633" y="425">Private App B</text>
  <rect class="private" x="630" y="460" width="130" height="54" />
  <text class="small" x="664" y="482">ECS</text>
  <text class="tiny" x="646" y="502">no public IP</text>

  <rect class="subnet" x="830" y="395" width="230" height="145" />
  <text class="label" x="875" y="425">Private DB</text>
  <rect class="data" x="875" y="460" width="140" height="54" />
  <text class="small" x="922" y="482">RDS</text>
  <text class="tiny" x="898" y="502">ECS SG only</text>

  <rect class="net" x="830" y="205" width="105" height="58" />
  <text class="small" x="858" y="228">NAT</text>
  <text class="tiny" x="846" y="248">or endpoints</text>

  <rect class="aws" x="1140" y="170" width="105" height="58" />
  <text class="label" x="1168" y="194">ECR</text>
  <text class="tiny" x="1157" y="212">endpoint</text>

  <rect class="aws" x="1140" y="260" width="105" height="58" />
  <text class="label" x="1154" y="284">Secrets</text>
  <text class="tiny" x="1157" y="302">endpoint</text>

  <rect class="aws" x="1140" y="350" width="105" height="58" />
  <text class="label" x="1160" y="374">Logs</text>
  <text class="tiny" x="1157" y="392">endpoint</text>

  <rect class="aws" x="1140" y="440" width="105" height="58" />
  <text class="label" x="1170" y="464">S3</text>
  <text class="tiny" x="1154" y="482">ECR layers</text>

  <path class="arrow" d="M160 366 L190 366" />
  <path class="arrow" d="M305 366 C340 300, 370 292, 410 292" />
  <path class="arrow" d="M540 292 L630 292" />
  <path class="arrow" d="M475 319 L475 460" />
  <path class="arrow" d="M695 319 L695 460" />
  <path class="arrow" d="M760 487 L875 487" />
  <path class="dash" d="M760 460 C830 370, 850 270, 830 234" />
  <path class="dash" d="M935 234 C1015 218, 1065 198, 1140 199" />
  <path class="dash" d="M935 234 C1015 258, 1065 288, 1140 289" />
  <path class="dash" d="M935 234 C1020 318, 1065 378, 1140 379" />
  <path class="dash" d="M935 234 C1020 385, 1065 468, 1140 469" />

  <text class="tiny" x="56" y="700">Stage 4 success: users still enter through HTTPS ALB, but ECS tasks and RDS are private. AWS service access is through NAT or VPC endpoints.</text>
</svg>
