name: Build Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "proxy.py"
      - "db.py"
      - "aws_secrets.py"
      - "run_all.py"
      - "chat_server.py"
      - "chat-panel.js"
      - "chat-panel.css"
      - "index.html"
      - "styles.css"
      - "sources/**"
      - "agent/**"
      - "build_and_push.ps1"
      - ".github/workflows/build-image.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY_NAME: contract-aggregator-tool

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and Push Image
        shell: pwsh
        run: |
          ./build_and_push.ps1 -Tag "${{ github.sha }}" -Region "${{ env.AWS_REGION }}" -RepositoryName "${{ env.ECR_REPOSITORY_NAME }}" -PushLatest